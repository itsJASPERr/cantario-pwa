media:
  - name: recordings
    label: Grabaciones
    input: public/media/recordings
    output: /cantario-pwa/media/recordings
    categories: [audio]
    extensions: [mp3, m4a, ogg, wav, webm]
    rename: safe
content:
  - name: songs
    label: Canciones
    type: collection
    path: src/content/songs
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, artist, language]
      primary: title
      search: [title, artist, language]
      sort: [title, artist]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: artist
        label: Artista
        type: string
        required: true
      - name: language
        label: Idioma
        type: select
        options:
          values:
            - { name: es, label: Español }
            - { name: en, label: English }
            - { name: pt, label: Português }
            - { name: de, label: Deutsch }
            - { name: other, label: Otro }
      - name: tags
        label: Etiquetas
        type: string
        list: true
      - name: spotify_url
        label: Spotify (enlace)
        type: string
      - name: youtube_url
        label: YouTube (enlace)
        type: string
      - name: shazam_url
        label: Shazam (enlace)
        type: string
      - name: recordings
        label: Grabaciones propias
        type: file
        description: Sube archivos MP3, M4A, OGG, WAV o WebM. Quedarán publicados en GitHub Pages.
        options:
          media: recordings
          multiple: true
          categories: [audio]
          extensions: [mp3, m4a, ogg, wav, webm]
          rename: safe
      - name: bpm
        label: Tempo de referencia (BPM)
        type: number
        description: 'Opcional. Pulsos por minuto (40–240). Si no lo sabés, usá Marcar pulso en Modo Escenario. El BPM solo da una referencia: no se deduce de las letras.'
      - name: duration_mmss
        label: Duración de referencia (mm:ss)
        type: string
        description: 'Opcional. Escribí 03:45 para 3 minutos y 45 segundos (mm:ss). Se usa con las marcas [mm:ss.xx] de cada línea. Sin tiempos válidos se usa Continuo.'
      - name: body
        label: Letra
        type: rich-text
        required: true
        description: 'En Source: [00:18.00][Am]Un paso, una huella, (inicio de línea cronometrado + acorde). Usá al menos dos tiempos crecientes, menores que Duración; las líneas sin tiempo quedan entre los puntos conocidos. Los acordes siguen usando [Am] y las indicaciones [*Suave]. Guardá en Source.'
        options:
          format: markdown
          switcher: true
          media: false

  - name: lists
    label: Listas publicadas
    type: collection
    path: src/content/lists
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, description]
      primary: title
      sort: [title]
      search: [title, description]
    fields:
      - name: title
        label: Nombre de la lista
        type: string
        required: true
      - name: description
        label: Descripción
        type: text
      - name: songs
        label: Canciones de la lista
        type: reference
        description: Una canción puede aparecer en tantas listas como quieras.
        options:
          collection: songs
          multiple: true
          value: "{name}"
          label: "{title} — {artist}"
          search: "title,artist"
